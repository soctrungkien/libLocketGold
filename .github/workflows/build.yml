name: Build Native Shared Libraries

on:
  push:
    branches:
      - "*"
  pull_request:
    branches:
      - "*"
  workflow_dispatch:

jobs:
  build-arm64:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Android NDK
        shell: bash
        run: |
          set -e

          NDK_PATH=""

          if [ -n "${ANDROID_NDK_LATEST_HOME:-}" ] && [ -d "$ANDROID_NDK_LATEST_HOME" ]; then
            NDK_PATH="$ANDROID_NDK_LATEST_HOME"
          fi

          if [ -z "$NDK_PATH" ] && [ -d "$ANDROID_HOME/ndk" ]; then
            NDK_PATH=$(find "$ANDROID_HOME/ndk" \
              -mindepth 1 \
              -maxdepth 1 \
              -type d | sort -V | tail -n 1)
          fi

          if [ -z "$NDK_PATH" ] && [ -d "$ANDROID_SDK_ROOT/ndk" ]; then
            NDK_PATH=$(find "$ANDROID_SDK_ROOT/ndk" \
              -mindepth 1 \
              -maxdepth 1 \
              -type d | sort -V | tail -n 1)
          fi

          if [ -z "$NDK_PATH" ] || [ ! -d "$NDK_PATH" ]; then
            echo "Android NDK not found"
            exit 1
          fi

          echo "Using Android NDK: $NDK_PATH"

          echo "ANDROID_NDK=$NDK_PATH" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$NDK_PATH" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$NDK_PATH" >> "$GITHUB_ENV"

      - name: Setup Xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: latest

      - name: Show build environment
        run: |
          xmake --version
          echo "ANDROID_NDK=$ANDROID_NDK"
          "$ANDROID_NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/clang" --version

      - name: Prepare Dobby
        shell: bash
        run: |
          set -e

          if [ ! -d "dobby" ]; then
            git clone --depth=1 https://github.com/jmpews/Dobby.git dobby
          fi

          echo "Dobby source:"
          find dobby -maxdepth 2 -type f | head -50

      - name: Build Dobby
        shell: bash
        run: |
          set -e

          cd dobby

          xmake config \
            --plat=android \
            --arch=arm64-v8a \
            --mode=release \
            --yes

          xmake build -v

          echo "Dobby build output:"
          find build -type f \( -name "*.so" -o -name "*.a" \) -print

      - name: Prepare Dobby library
        shell: bash
        run: |
          set -e

          DOBBY_LIB=$(find dobby/build \
            -type f \
            -name "libdobby.so" \
            | head -n 1)

          if [ -z "$DOBBY_LIB" ]; then
            echo "ERROR: libdobby.so was not generated."
            find dobby/build -type f -print
            exit 1
          fi

          echo "Found Dobby:"
          echo "$DOBBY_LIB"

          mkdir -p dobby/lib/arm64-v8a

          cp "$DOBBY_LIB" \
            dobby/lib/arm64-v8a/libdobby.so

          echo "Prepared:"
          ls -lh dobby/lib/arm64-v8a/libdobby.so

      - name: Configure Xmake
        run: |
          xmake config \
            --plat=android \
            --arch=arm64-v8a \
            --mode=release \
            --yes

      - name: Build ARM64 libraries
        run: |
          xmake build -v

      - name: Find both shared libraries
        shell: bash
        run: |
          set -e

          echo "Generated .so files:"
          find build -type f -name "*.so" -print

          GOLD=$(find build \
            -type f \
            -name "liblocket_gold.so" \
            | head -n 1)

          LOADER=$(find build \
            -type f \
            -name "liblocket_loader.so" \
            | head -n 1)

          if [ -z "$GOLD" ]; then
            echo "ERROR: liblocket_gold.so was not found."
            exit 1
          fi

          if [ -z "$LOADER" ]; then
            echo "ERROR: liblocket_loader.so was not found."
            exit 1
          fi

          echo "GOLD_PATH=$GOLD" >> "$GITHUB_ENV"
          echo "LOADER_PATH=$LOADER" >> "$GITHUB_ENV"

          echo ""
          echo "liblocket_gold.so:"
          echo "$GOLD"

          echo ""
          echo "liblocket_loader.so:"
          echo "$LOADER"

      - name: Verify libraries
        run: |
          file "$GOLD_PATH"
          file "$LOADER_PATH"

          echo ""
          ls -lh "$GOLD_PATH"
          ls -lh "$LOADER_PATH"

      - name: Verify Dobby dependency
        shell: bash
        run: |
          set -e

          echo "Checking liblocket_gold.so dependencies:"
          "$ANDROID_NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf" \
            -d "$GOLD_PATH" || true

          echo ""
          echo "Checking liblocket_loader.so dependencies:"
          "$ANDROID_NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf" \
            -d "$LOADER_PATH" || true

      - name: Prepare artifacts
        shell: bash
        run: |
          set -e

          mkdir -p artifact

          cp "$GOLD_PATH" \
            artifact/liblocket_gold-arm64-v8a.so

          cp "$LOADER_PATH" \
            artifact/liblocket_loader-arm64-v8a.so

          echo "Prepared files:"
          ls -lh artifact/

      - name: Upload ARM64 libraries
        uses: actions/upload-artifact@v4
        with:
          name: locket-gold-arm64-v8a
          path: artifact/
          if-no-files-found: error
          retention-days: 30
