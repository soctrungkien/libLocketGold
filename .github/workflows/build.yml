name: Build Native Shared Library

on:
  push:
    branches: [ "*" ] # Chạy tự động mỗi khi push/sửa code ở bất kỳ branch nào
  pull_request:
    branches: [ "*" ] # Chạy khi tạo hoặc cập nhật Pull Request
  workflow_dispatch:  # Cho phép bấm nút "Run workflow" thủ công trên GitHub UI

jobs:
  build-arm64:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Android NDK
        uses: nsetup/setup-ndk@v3
        with:
          ndk-version: r26b

      - name: Setup Xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: latest

      - name: Build shared library (.so)
        run: |
          xmake config --plat=android --arch=arm64-v8a --mode=release --yes
          xmake -v

      - name: Upload Artifact (.so)
        uses: actions/upload-artifact@v4
        with:
          name: libLocketGold
          path: build/android/arm64-v8a/release/libLocketGold.so
          if-no-files-found: error

          
