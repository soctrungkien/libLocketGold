name: Build Native Shared Library

on:
  push:
    branches: [ "*" ]
  pull_request:
    branches: [ "*" ]
  workflow_dispatch:

jobs:
  build-arm64:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      # Tận dụng NDK đã cài sẵn trên GitHub Runner (không phụ thuộc Action bên thứ 3)
      - name: Setup Android NDK (Pre-installed)
        run: |
          NDK_PATH=$(ls -d $ANDROID_HOME/ndk/* 2>/dev/null | tail -n 1)
          if [ -z "$NDK_PATH" ]; then
            NDK_PATH=$(ls -d $ANDROID_SDK_ROOT/ndk/* 2>/dev/null | tail -n 1)
          fi
          echo "Using Android NDK from: $NDK_PATH"
          echo "ANDROID_NDK_HOME=$NDK_PATH" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$NDK_PATH" >> $GITHUB_ENV

      - name: Setup Xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: latest

      - name: Build shared library (.so)
        run: |
          xmake config --plat=android --arch=arm64-v8a --mode=release --yes
          xmake -v

      - name: Upload Artifact (.so)
        uses: actions/upload-artifact@v4
        with:
          name: libLocketGold-arm64-v8a
          path: build/android/arm64-v8a/release/libLocketGold.so
          if-no-files-found: error
